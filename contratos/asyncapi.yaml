asyncapi: 3.0.0
info:
  title: RedVital — Eventos del Servicio de Donación
  version: 1.0.0
  description: |
    Contratos de los eventos que publica el Servicio de Donación y de los que
    consume (DD V3.0, Tabla 27; Herramientas V4.0, entrada 93). Kafka es el
    único canal entre servicios: ninguno llama a otro por HTTP.

    Política de contenido (RT-16): ningún evento transporta información
    clínica, documento ni teléfono. La única excepción es EV-02: como
    Notificaciones no consulta a Donación, el aviso lleva el correo y el nombre
    del destinatario. Su tema solo lo lee Notificaciones (las ACL niegan la
    lectura incluso a la inspección) y se borra a los siete días.

    Publicación: bandeja de salida transaccional (ADR-018), productor
    idempotente con acks=all. Todo consumidor debe ser idempotente: un evento
    puede llegar más de una vez y se reconoce por la cabecera evento-id.
defaultContentType: application/json

servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: Broker único en KRaft (Apache Kafka 4.3). Autenticación SASL/SCRAM-SHA-512 por servicio.
    security:
      - $ref: '#/components/securitySchemes/scram'

channels:
  donacionCompletada:
    address: redvital.donacion.donation-completed.v1
    title: EV-01 — Donación registrada
    description: Productor Donación; consumidor Campañas (grupo campanias), que cuenta las donaciones de cada campaña (RF-25).
    messages:
      donacionCompletada:
        $ref: '#/components/messages/DonacionCompletada'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  avisoSolicitado:
    address: redvital.donacion.notice-requested.v1
    title: EV-02 — Aviso solicitado
    description: Productor Donación; consumidor el trabajador de Notificaciones (grupo notificaciones).
    messages:
      avisoSolicitado:
        $ref: '#/components/messages/AvisoSolicitado'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  indicadoresActualizados:
    address: redvital.donacion.indicators-updated.v1
    title: EV-09 — Indicadores actualizados
    description: |
      Productor Donación; consumidor Institucional (grupo institucional), que
      compone con él el tablero de M7 (RF-13) sin consultar a Donación. Una
      fotografía completa por institución, de los últimos 731 días, que se
      publica solo cuando cambia; reemplaza la anterior.
    messages:
      indicadoresActualizados:
        $ref: '#/components/messages/IndicadoresActualizados'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  auditoriaRegistrada:
    address: redvital.donacion.audit-recorded.v1
    title: EV-10 — Registro de auditoría (Donación)
    description: |
      Productor Donación; consumidor Institucional (grupo institucional), que
      compone la bitácora del auditor (ST2, ADR-016). Cada registro de
      registro_auditoria sale en la misma transacción que lo escribe.
    messages:
      auditoriaRegistrada:
        $ref: '#/components/messages/AuditoriaRegistrada'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
        bindingVersion: 0.5.0
  institucionCambiada:
    address: redvital.institucional.institution-changed.v1
    title: EV-07 — Institución cambiada (consumido)
    description: |
      Productor Institucional; contrato en el repositorio de Institucional.
      Donación lo consume (grupo donacion) para mantener su copia de las
      instituciones: el alcance territorial de U5 y U6 y el nombre del banco en
      el historial del donante, sin llamar a Institucional.
    messages:
      institucionCambiada:
        $ref: '#/components/messages/InstitucionCambiada'
  campaniaPublicada:
    address: redvital.campanias.campaign-published.v1
    title: EV-03 — Campaña publicada (consumido)
    description: |
      Productor Campañas; contrato en el repositorio de Campañas. Donación lo
      consume (grupo donacion) para mantener la proyección local de campañas
      con la que confirma la campaña de una donación, sin llamar a Campañas.
    messages:
      campaniaPublicada:
        $ref: '#/components/messages/CampaniaPublicada'

operations:
  publicarDonacionCompletada:
    action: send
    channel:
      $ref: '#/channels/donacionCompletada'
    messages:
      - $ref: '#/channels/donacionCompletada/messages/donacionCompletada'
  publicarAvisoSolicitado:
    action: send
    channel:
      $ref: '#/channels/avisoSolicitado'
    messages:
      - $ref: '#/channels/avisoSolicitado/messages/avisoSolicitado'
  publicarIndicadoresActualizados:
    action: send
    channel:
      $ref: '#/channels/indicadoresActualizados'
    messages:
      - $ref: '#/channels/indicadoresActualizados/messages/indicadoresActualizados'
  publicarAuditoriaRegistrada:
    action: send
    channel:
      $ref: '#/channels/auditoriaRegistrada'
    messages:
      - $ref: '#/channels/auditoriaRegistrada/messages/auditoriaRegistrada'
  consumirInstitucionCambiada:
    action: receive
    channel:
      $ref: '#/channels/institucionCambiada'
    messages:
      - $ref: '#/channels/institucionCambiada/messages/institucionCambiada'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [donacion]
        bindingVersion: 0.5.0
  consumirCampaniaPublicada:
    action: receive
    channel:
      $ref: '#/channels/campaniaPublicada'
    messages:
      - $ref: '#/channels/campaniaPublicada/messages/campaniaPublicada'
    bindings:
      kafka:
        groupId:
          type: string
          enum: [donacion]
        bindingVersion: 0.5.0

components:
  securitySchemes:
    scram:
      type: scramSha512
      description: Un usuario SCRAM por servicio, con ACL de la Tabla 30 del DD.

  messages:
    DonacionCompletada:
      name: donation.completed
      title: Donación registrada
      summary: Un operador registró una donación en una institución.
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/DonacionCompletadaV1'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: donacion_id
          bindingVersion: 0.5.0
    AvisoSolicitado:
      name: notice.requested
      title: Aviso solicitado
      summary: Donación pide avisar a un donante, con el correo y el nombre a los que se escribe.
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/AvisoSolicitadoV1'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: destinatario_id
          bindingVersion: 0.5.0
    IndicadoresActualizados:
      name: indicators.updated
      title: Indicadores actualizados
      summary: Fotografía de los agregados de M7 de una institución. Solo conteos.
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/IndicadoresActualizadosV1'
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: institucion_id
          bindingVersion: 0.5.0
    AuditoriaRegistrada:
      name: audit.recorded
      title: Registro de auditoría
      summary: Un registro de la serie de auditoría, con la estructura común de las cuatro series.
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/AuditoriaRegistradaV1'
      bindings:
        kafka:
          key:
            type: string
            description: correlacion_id, para que los registros de una operación lleguen en orden
          bindingVersion: 0.5.0
    InstitucionCambiada:
      name: institution.changed
      title: Institución cambiada
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/InstitucionCambiadaV1'
    CampaniaPublicada:
      name: campaign.published
      title: Campaña publicada
      headers:
        $ref: '#/components/schemas/Cabeceras'
      payload:
        $ref: '#/components/schemas/CampaniaPublicadaV1'

  schemas:
    Cabeceras:
      type: object
      required: [evento-id, evento-tipo, evento-version, correlacion-id, ocurrido-en, productor]
      properties:
        evento-id:
          type: string
          format: uuid
          description: Identificador único del evento; clave de deduplicación del consumidor.
        evento-tipo:
          type: string
        evento-version:
          type: string
          description: Versión mayor del contrato.
        correlacion-id:
          type: string
          maxLength: 36
          description: Correlación de la petición o del ciclo que produjo el hecho (EC-20).
        ocurrido-en:
          type: string
          format: date-time
        productor:
          type: string

    DonacionCompletadaV1:
      type: object
      additionalProperties: false
      required: [donacion_id, institucion_id, campania_id, tipo_donacion, fecha_captacion, unidades_generadas]
      properties:
        donacion_id:
          type: string
          format: uuid
        institucion_id:
          type: string
          format: uuid
          description: Institución donde se captó.
        campania_id:
          type: [string, 'null']
          format: uuid
          description: Nulo si la donación no se hizo en campaña o si la campaña no pudo confirmarse.
        tipo_donacion:
          type: string
          enum: [sangre_total]
        fecha_captacion:
          type: string
          format: date-time
        unidades_generadas:
          type: integer
          minimum: 1
          maximum: 3

    AvisoSolicitadoV1:
      type: object
      additionalProperties: false
      required: [aviso_id, tipo_aviso, destinatario_tipo, destinatario_id, correo, nombre, campania_id, generado_en]
      properties:
        aviso_id:
          type: string
          format: uuid
        tipo_aviso:
          type: string
          description: |
            Tipo de aviso (DD, Tabla 18). cuenta_creada confirma el registro de un
            donante y no exige el consentimiento de avisos. Añadir un tipo es
            compatible si el consumidor se despliega antes que el productor.
          enum: [campania_publicada, cuenta_creada]
        destinatario_tipo:
          type: string
          enum: [donante]
        destinatario_id:
          type: string
          format: uuid
        correo:
          type: string
          format: email
          maxLength: 160
          description: Correo de contacto del donante, al que Notificaciones escribe. Donación no emite el aviso si no lo tiene.
        nombre:
          type: string
          maxLength: 120
          description: Nombre con el que se saluda al destinatario.
        campania_id:
          type: [string, 'null']
          format: uuid
        plantilla:
          type: object
          description: |
            Datos del tipo de aviso para la plantilla. campania_publicada: nombre, sede, inicia_en y
            termina_en de la campaña. cuenta_creada: vacía. Opcional: un evento
            anterior sin plantilla sigue siendo válido.
          additionalProperties:
            type: string
            maxLength: 200
        generado_en:
          type: string
          format: date-time

    CampaniaPublicadaV1:
      type: object
      description: Forma definida por Campañas. Donación tolera campos nuevos.
      required: [campania_id, institucion_id, nombre, sede, territorio_codigo, territorio_ruta, inicia_en, termina_en, publicada_en]
      properties:
        campania_id:
          type: string
          format: uuid
        institucion_id:
          type: string
          format: uuid
        nombre:
          type: string
          maxLength: 160
        sede:
          type: string
          maxLength: 200
        territorio_codigo:
          type: string
          pattern: '^[0-9]{5}$'
        territorio_ruta:
          type: string
          pattern: '^/00(/[0-9]{2}(/[0-9]{5})?)?$'
        inicia_en:
          type: string
          format: date-time
        termina_en:
          type: string
          format: date-time
        publicada_en:
          type: string
          format: date-time

    IndicadoresActualizadosV1:
      type: object
      additionalProperties: false
      required: [institucion_id, generado_en, desde, hasta, captacion, inventario]
      properties:
        institucion_id:
          type: string
          format: uuid
        generado_en:
          type: string
          format: date-time
          description: Momento de la fotografía; una más vieja que la vigente no la reemplaza.
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        captacion:
          type: array
          description: Un elemento por día con captación; los días sin donaciones no aparecen.
          items:
            type: object
            additionalProperties: false
            required: [dia, donaciones, unidades_generadas, unidades_no_aptas, unidades_vencidas]
            properties:
              dia: { type: string, format: date }
              donaciones: { type: integer, minimum: 0 }
              unidades_generadas: { type: integer, minimum: 0 }
              unidades_no_aptas:
                type: integer
                minimum: 0
                description: Sin suprimir; Institucional la oculta en los periodos con menos de cinco donaciones.
              unidades_vencidas: { type: integer, minimum: 0 }
        inventario:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [componente, grupo_sanguineo, unidades_disponibles, unidades_por_vencer, bajo_umbral]
            properties:
              componente: { type: string, maxLength: 30 }
              grupo_sanguineo: { type: string, enum: [O-, O+, A-, A+, B-, B+, AB-, AB+] }
              unidades_disponibles: { type: integer, minimum: 0 }
              unidades_por_vencer: { type: integer, minimum: 0 }
              bajo_umbral: { type: boolean }

    AuditoriaRegistradaV1:
      type: object
      description: Estructura común de las cuatro series (DD, Sección 5). Sin el contenido del recurso.
      additionalProperties: false
      required: [id, actor_tipo, actor_id, rol, jurisdiccion_solicitada, operacion, recurso_tipo, recurso_id, resultado,
                 correlacion_id, origen, ocurrido_en]
      properties:
        id: { type: string, format: uuid }
        actor_tipo: { type: string, enum: [usuario, sistema, anonimo] }
        actor_id: { type: [string, 'null'], maxLength: 64 }
        rol: { type: [string, 'null'], maxLength: 40 }
        jurisdiccion_solicitada: { type: [string, 'null'], maxLength: 80 }
        operacion: { type: string, maxLength: 80 }
        recurso_tipo: { type: string, maxLength: 40 }
        recurso_id: { type: [string, 'null'], format: uuid }
        resultado: { type: string, enum: [permitido, denegado] }
        correlacion_id: { type: string, maxLength: 36 }
        origen: { type: [string, 'null'], maxLength: 45 }
        ocurrido_en: { type: string, format: date-time }

    InstitucionCambiadaV1:
      type: object
      description: Forma definida por Institucional. Donación tolera campos nuevos.
      required: [institucion_id, codigo, nombre, tipo, territorio_codigo, territorio_ruta, vigente, cambiado_en]
      properties:
        institucion_id: { type: string, format: uuid }
        codigo: { type: string, maxLength: 20 }
        nombre: { type: string, maxLength: 160 }
        tipo: { type: string, enum: [banco_de_sangre, servicio_transfusion] }
        territorio_codigo: { type: string, pattern: '^[0-9]{5}$' }
        territorio_ruta: { type: string, pattern: '^/00/[0-9]{2}/[0-9]{5}$' }
        vigente: { type: boolean }
        cambiado_en: { type: string, format: date-time }
