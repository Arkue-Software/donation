# RedVital — Servicio de Donación.
# Los secretos llegan como archivos en /run/secrets (configtree): cada archivo
# se lee como la propiedad de su mismo nombre. Nunca se escriben aquí.
server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: redvital-donacion-service
  config:
    import: optional:configtree:${REDVITAL_SECRETOS:/run/secrets/}
  datasource:
    # En QA y producción: sslmode=verify-ca&sslrootcert=/run/secrets/postgres_ca
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_donacion}?${DB_PARAMETROS:sslmode=prefer}
    username: ${DB_USUARIO:donacion_servicio}
    # Archivo /run/secrets/donacion_servicio
    password: ${donacion_servicio:}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
      connection-timeout: 5000
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVIDORES:localhost:9092}
    security:
      protocol: ${KAFKA_PROTOCOLO:SASL_PLAINTEXT}
    properties:
      sasl.mechanism: SCRAM-SHA-512
      # Archivo /run/secrets/kafka_donacion
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USUARIO:donacion}" password="${kafka_donacion:}";
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: donacion
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
      ack-mode: record
    admin:
      auto-create: false
      fail-fast: false

management:
  server:
    port: ${PUERTO_GESTION:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Una caída del broker no saca al servicio de servicio (EC-08).
    kafka:
      enabled: false

redvital:
  zona-horaria: America/Bogota
  jwt:
    # Emisor y audiencia que firma hoy identity-service (EmisorTokenAcceso).
    emisor: ${JWT_EMISOR:https://identidad.redvital.local}
    audiencia: ${JWT_AUDIENCIA:redvital}
    jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
  identidad:
    url: ${IDENTIDAD_URL:http://identity-service:8080}
    cliente: donacion
    # Archivo /run/secrets/donacion_secreto_identidad
    secreto: ${donacion_secreto_identidad:}
    plazo: 3s
  documento:
    # Archivo /run/secrets/donacion_clave_hmac. Estable y respaldada: rotarla deja huérfanos los resúmenes.
    clave-hmac: ${donacion_clave_hmac:}
  avisos:
    habilitados: ${AVISOS_HABILITADOS:true}
  procesos:
    habilitados: ${PROCESOS_HABILITADOS:true}

logging:
  pattern:
    correlation: "[%X{correlacion_id:-}] "
